    <style>
      :root {
        --blue: #287bb9;
        --sky: #5aaee6;
        --deep: #235c85;
        --ink: #294b63;
        --muted: #597587;
        --pale: #eff8fd;
        --line: #d6e9f5;
        --white: #fff;
        --pink: #ff8fb1;
        --font: 'Nunito', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        --bounce: cubic-bezier(.34, 1.56, .64, 1);
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        position: relative;
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 40px 16px;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 15% 10%, #d7edfb 0, transparent 40%),
          radial-gradient(circle at 90% 85%, #ffe3ec 0, transparent 38%),
          linear-gradient(180deg, #f3faff 0%, #e6f3fc 100%);
        color: var(--ink);
        font: 16px/1.7 var(--font);
        -webkit-font-smoothing: antialiased;
      }

      /* Soft blobs drifting behind everything */
      .blob {
        position: fixed;
        z-index: 0;
        border-radius: 50%;
        filter: blur(48px);
        opacity: .55;
        pointer-events: none;
        animation: drift 18s ease-in-out infinite alternate;
      }
      .blob.one { width: 340px; height: 340px; top: -90px; left: -80px; background: #bfe1f8; }
      .blob.two { width: 300px; height: 300px; bottom: -100px; right: -70px; background: #ffd3e1; animation-duration: 22s; animation-delay: -6s; }
      .blob.three { width: 220px; height: 220px; top: 45%; left: 60%; background: #d9f2e6; animation-duration: 26s; animation-delay: -12s; }
      @keyframes drift {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(40px, 30px) scale(1.12); }
        100% { transform: translate(-30px, 50px) scale(.95); }
      }

      /* Paws, hearts and snowflakes floating up */
      .sky {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .floaty {
        position: absolute;
        bottom: -40px;
        color: var(--sky);
        opacity: 0;
        animation: rise linear infinite;
      }
      .floaty svg { display: block; width: 100%; height: 100%; fill: currentColor; }
      @keyframes rise {
        0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
        10% { opacity: var(--alpha, .35); }
        50% { transform: translate(var(--sway, 30px), -55vh) rotate(var(--spin, 90deg)); }
        90% { opacity: var(--alpha, .35); }
        100% { transform: translate(0, -110vh) rotate(calc(var(--spin, 90deg) * 2)); opacity: 0; }
      }

      main {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
        text-align: center;
      }

      /* Avatar */
      .avatar-wrap {
        position: relative;
        width: 136px;
        height: 136px;
        margin: 0 auto;
        animation: pop-in .8s var(--bounce) both;
      }
      .avatar-btn {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: none;
        cursor: pointer;
        animation: float 4s ease-in-out infinite;
        -webkit-tap-highlight-color: transparent;
      }
      .avatar-btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 6px; }
      .ring {
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, var(--sky), var(--pink), #9be3c1, #ffd27a, var(--sky));
        animation: spin 8s linear infinite;
      }
      .ring::after {
        content: '';
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        background: var(--white);
      }
      .avatar {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 10px 30px #287bb933;
      }
      .avatar-btn.wiggle .avatar { animation: wiggle .6s ease; }
      .bubble {
        position: absolute;
        top: -6px;
        left: calc(100% - 18px);
        padding: 6px 12px;
        border-radius: 16px 16px 16px 4px;
        background: var(--white);
        color: var(--deep);
        font-weight: 800;
        font-size: .9rem;
        white-space: nowrap;
        box-shadow: 0 6px 18px #235c8526;
        transform-origin: 0 100%;
        transform: scale(0) rotate(-12deg);
        opacity: 0;
        pointer-events: none;
        transition: transform .35s var(--bounce), opacity .2s;
      }
      .bubble.show { transform: scale(1) rotate(0); opacity: 1; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes wiggle {
        0%, 100% { transform: rotate(0); }
        20% { transform: rotate(-10deg) scale(1.05); }
        40% { transform: rotate(8deg) scale(1.05); }
        60% { transform: rotate(-5deg); }
        80% { transform: rotate(3deg); }
      }
      @keyframes pop-in {
        0% { transform: scale(.3); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      /* Heading */
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 26px 0 6px;
        padding: 4px 12px;
        border-radius: 999px;
        background: #ffffffb3;
        color: var(--blue);
        font-size: .72rem;
        font-weight: 800;
        letter-spacing: .18em;
        box-shadow: 0 2px 10px #287bb914;
        animation: fade-up .6s .25s ease both;
      }
      .chip svg { width: 13px; height: 13px; fill: var(--pink); animation: beat 1.4s ease-in-out infinite; }
      @keyframes beat {
        0%, 100% { transform: scale(1); }
        15% { transform: scale(1.3); }
        30% { transform: scale(1); }
        45% { transform: scale(1.2); }
      }
      h1 {
        margin: 0;
        color: var(--deep);
        font-size: 2rem;
        line-height: 1.3;
        letter-spacing: .06em;
      }
      h1 span {
        display: inline-block;
        animation: hop .7s var(--bounce) both, wave 3.2s ease-in-out infinite;
        animation-delay: calc(.35s + var(--i) * .08s), calc(1.6s + var(--i) * .12s);
      }
      @keyframes hop {
        0% { transform: translateY(24px) scale(.6); opacity: 0; }
        100% { transform: none; opacity: 1; }
      }
      @keyframes wave {
        0%, 70%, 100% { transform: translateY(0); }
        80% { transform: translateY(-7px); }
        90% { transform: translateY(1px); }
      }
      .lead {
        margin: 8px 0 30px;
        color: var(--muted);
        font-size: .95rem;
        animation: fade-up .6s .7s ease both;
      }
      .lead span { display: inline-block; }
      @keyframes fade-up {
        0% { transform: translateY(12px); opacity: 0; }
        100% { transform: none; opacity: 1; }
      }

      /* Donate buttons */
      .buttons {
        display: grid;
        gap: 16px;
        perspective: 800px;
      }
      .donate {
        --rx: 0deg;
        --ry: 0deg;
        --mx: 50%;
        --my: 50%;
        position: relative;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 20px 14px 14px;
        overflow: hidden;
        border: 2px solid var(--white);
        border-radius: 26px;
        background: #ffffffe6;
        color: var(--ink);
        text-decoration: none;
        box-shadow: 0 4px 16px #235c8514, 0 1px 0 #fff inset;
        transform: rotateX(var(--rx)) rotateY(var(--ry));
        transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
        animation: slide-in .7s var(--bounce) backwards;
        animation-delay: calc(.85s + var(--i) * .12s);
        -webkit-tap-highlight-color: transparent;
      }
      @keyframes slide-in {
        0% { transform: translateY(30px) scale(.9); opacity: 0; }
        100% { transform: none; opacity: 1; }
      }
      /* Glow that follows the pointer */
      .donate::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(180px circle at var(--mx) var(--my), var(--tint), transparent 70%);
        opacity: 0;
        transition: opacity .25s;
        pointer-events: none;
      }
      /* Shine sweep */
      .donate::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: -60%;
        width: 40%;
        background: linear-gradient(105deg, transparent, #ffffffcc, transparent);
        transform: skewX(-18deg);
        pointer-events: none;
      }
      .donate:hover, .donate:focus-visible {
        border-color: var(--accent);
        box-shadow: 0 14px 30px -8px var(--shadow), 0 1px 0 #fff inset;
        transform: rotateX(var(--rx)) rotateY(var(--ry)) translateY(-3px);
      }
      .donate:hover::before, .donate:focus-visible::before { opacity: 1; }
      .donate:hover::after, .donate:focus-visible::after { animation: shine .8s ease; }
      .donate:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      .donate:active { transform: scale(.97); transition-duration: .08s; }
      @keyframes shine { to { left: 130%; } }

      .icon {
        position: relative;
        flex: none;
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 42% 58% 55% 45% / 50% 45% 55% 50%;
        background: var(--tint);
        color: var(--accent);
        animation: morph 7s ease-in-out infinite;
        animation-delay: calc(var(--i) * -2s);
      }
      .icon svg {
        width: 34px;
        height: 34px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        overflow: visible;
      }
      .icon .solid { fill: currentColor; stroke: none; }
      .icon .soft { fill: var(--white); }
      .icon .blush { fill: #ff9db8; stroke: none; }
      .donate:hover .icon svg, .donate:focus-visible .icon svg { animation: jiggle .7s ease; }
      @keyframes morph {
        0%, 100% { border-radius: 42% 58% 55% 45% / 50% 45% 55% 50%; }
        33% { border-radius: 58% 42% 45% 55% / 45% 58% 42% 55%; }
        66% { border-radius: 50% 50% 60% 40% / 58% 42% 58% 42%; }
      }
      @keyframes jiggle {
        0% { transform: rotate(0) scale(1); }
        25% { transform: rotate(-12deg) scale(1.15); }
        50% { transform: rotate(9deg) scale(1.1); }
        75% { transform: rotate(-4deg) scale(1.05); }
        100% { transform: rotate(0) scale(1); }
      }
      /* Per-icon extra motion on hover */
      .donate:hover .coin, .donate:focus-visible .coin { animation: coin-hop .7s var(--bounce); }
      .donate:hover .coin.two, .donate:focus-visible .coin.two { animation-delay: .1s; }
      @keyframes coin-hop { 40% { transform: translateY(-4px); } }
      .donate:hover .ear, .donate:focus-visible .ear { animation: ear-flick .5s ease 2; }
      .ear { transform-box: fill-box; }
      .ear.left { transform-origin: 100% 30%; }
      .ear.right { transform-origin: 0 30%; }
      @keyframes ear-flick { 50% { transform: rotate(var(--flick)); } }
      .ear.left { --flick: 18deg; }
      .ear.right { --flick: -18deg; }
      .donate:hover .card-heart, .donate:focus-visible .card-heart { animation: beat 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

      .label {
        position: relative;
        flex: 1;
        text-align: left;
        line-height: 1.3;
      }
      .label strong {
        display: block;
        color: var(--deep);
        font-size: 1.15rem;
        letter-spacing: .04em;
      }
      .label span {
        color: var(--muted);
        font-size: .8rem;
        letter-spacing: .04em;
      }
      .go {
        position: relative;
        flex: none;
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--tint);
        color: var(--accent);
        transition: transform .3s var(--bounce), background .25s, color .25s;
      }
      .go svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .donate:hover .go, .donate:focus-visible .go { transform: translateX(4px) rotate(-45deg); background: var(--accent); color: var(--white); }

      .ecpay { --i: 0; --accent: #2a9d68; --tint: #dcf5e8; --shadow: #2a9d6866; }
      .opay { --i: 1; --accent: #e9772f; --tint: #ffe9da; --shadow: #e9772f66; }
      .deer { --i: 2; --accent: #a8682e; --tint: #f6e8d8; --shadow: #a8682e66; }

      .home {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 30px;
        padding: 6px 14px;
        border-radius: 999px;
        color: var(--muted);
        font-size: .9rem;
        text-decoration: none;
        transition: color .2s, background .2s;
        animation: fade-up .6s 1.4s ease both;
      }
      .home svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s var(--bounce); }
      .home:hover, .home:focus-visible { color: var(--deep); background: #ffffffb3; }
      .home:hover svg, .home:focus-visible svg { transform: translateX(-4px); }
      .home:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

      /* Click bursts */
      .particle {
        position: fixed;
        z-index: 10;
        width: 16px;
        height: 16px;
        margin: -8px 0 0 -8px;
        pointer-events: none;
      }
      .particle svg { display: block; width: 100%; height: 100%; fill: currentColor; }

      @media (max-width: 380px) {
        h1 { font-size: 1.75rem; }
        .donate { gap: 12px; padding: 12px 16px 12px 12px; }
        .icon { width: 50px; height: 50px; }
        .icon svg { width: 30px; height: 30px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          animation-delay: 0s !important;
          transition-duration: .01ms !important;
        }
        .sky, .blob { display: none; }
      }
    </style>
  </head>

            </svg>
          </span>
          <span class="label"><strong>山羌</strong><span>Deer Donate</span></span>
          <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" /></svg></span>
        </a>
      </nav>

      <a class="home" href="../"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6" /></svg>回到多帕的首頁</a>
    </main>

    <script>
      (function () {
        var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var shapes = ['p-heart', 'p-paw', 'p-flake', 'p-star'];
        var colors = ['#5aaee6', '#ff8fb1', '#7fcfa8', '#ffc65c', '#9cc8ec'];
        var pick = function (list) { return list[Math.floor(Math.random() * list.length)]; };
        var icon = function (shape) {
          return '<svg viewBox="0 0 24 24"><use href="#' + shape + '"></use></svg>';
        };

        // Background: things drifting up.
        if (!calm) {
          var sky = document.querySelector('.sky');
          var count = window.innerWidth < 600 ? 12 : 20;
          for (var n = 0; n < count; n++) {
            var bit = document.createElement('span');
            var size = 10 + Math.random() * 18;
            bit.className = 'floaty';
            bit.innerHTML = icon(pick(shapes));
            bit.style.cssText =
              'left:' + (Math.random() * 100) + '%;width:' + size + 'px;height:' + size + 'px;' +
              'color:' + pick(colors) + ';animation-duration:' + (12 + Math.random() * 14) + 's;' +
              'animation-delay:' + (-Math.random() * 26) + 's;--sway:' + (Math.random() * 80 - 40) + 'px;' +
              '--spin:' + (Math.random() * 180 - 90) + 'deg;--alpha:' + (.25 + Math.random() * .3);
            sky.appendChild(bit);
          }
        }

        // A burst of hearts and paws from a point.
        function burst(x, y, amount, palette) {
          if (calm || !document.body.animate) return;
          for (var n = 0; n < amount; n++) {
            var bit = document.createElement('span');
            bit.className = 'particle';
            bit.innerHTML = icon(pick(['p-heart', 'p-paw', 'p-star', 'p-heart']));
            bit.style.left = x + 'px';
            bit.style.top = y + 'px';
            bit.style.color = pick(palette || colors);
            document.body.appendChild(bit);
            var angle = Math.random() * Math.PI * 2;
            var distance = 50 + Math.random() * 70;
            var scale = .6 + Math.random() * .8;
            bit.animate([
              { transform: 'translate(0,0) scale(0) rotate(0deg)', opacity: 1 },
              { transform: 'translate(' + Math.cos(angle) * distance * .7 + 'px,' + Math.sin(angle) * distance * .7 + 'px) scale(' + scale + ') rotate(' + (Math.random() * 60 - 30) + 'deg)', opacity: 1, offset: .55 },
              { transform: 'translate(' + Math.cos(angle) * distance + 'px,' + (Math.sin(angle) * distance + 30) + 'px) scale(' + scale * .8 + ') rotate(' + (Math.random() * 120 - 60) + 'deg)', opacity: 0 }
            ], { duration: 900 + Math.random() * 400, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = function () {
              this.effect.target.remove();
            };
          }
        }

        // Pet the avatar: wiggle, say something, sprinkle hearts.
        var avatar = document.querySelector('.avatar-btn');
        var bubble = document.querySelector('.bubble');
        var lines = ['汪！', '汪汪汪！', 'ともとも！', '謝謝你～', '(っ´ω`c)', '摸摸頭！', '嗷嗚～'];
        var last = -1, hide;
        avatar.addEventListener('click', function () {
          var next;
          do { next = Math.floor(Math.random() * lines.length); } while (next === last);
          last = next;
          bubble.textContent = lines[next];
          bubble.classList.add('show');
          clearTimeout(hide);
          hide = setTimeout(function () { bubble.classList.remove('show'); }, 1600);
          avatar.classList.remove('wiggle');
          void avatar.offsetWidth;
          avatar.classList.add('wiggle');
          var box = avatar.getBoundingClientRect();
          burst(box.left + box.width / 2, box.top + box.height / 2, 12);
        });
        // Say hello once after the page settles.
        setTimeout(function () {
          bubble.textContent = '汪！';
          bubble.classList.add('show');
          hide = setTimeout(function () { bubble.classList.remove('show'); }, 1800);
        }, 1500);

        // Buttons: glow follows the pointer, a gentle 3D tilt, and a burst on click.
        var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        document.querySelectorAll('.donate').forEach(function (link) {
          var accent = getComputedStyle(link).getPropertyValue('--accent').trim();
          link.addEventListener('pointermove', function (event) {
            var box = link.getBoundingClientRect();
            var px = (event.clientX - box.left) / box.width;
            var py = (event.clientY - box.top) / box.height;
            link.style.setProperty('--mx', px * 100 + '%');
            link.style.setProperty('--my', py * 100 + '%');
            if (fine && !calm) {
              link.style.setProperty('--ry', (px - .5) * 8 + 'deg');
              link.style.setProperty('--rx', (.5 - py) * 10 + 'deg');
            }
          });
          link.addEventListener('pointerleave', function () {
            link.style.setProperty('--rx', '0deg');
            link.style.setProperty('--ry', '0deg');
          });
          link.addEventListener('click', function (event) {
            var box = link.getBoundingClientRect();
            var x = event.clientX || box.left + box.width / 2;
            var y = event.clientY || box.top + box.height / 2;
            burst(x, y, 14, [accent, '#ff8fb1', '#ffc65c', '#5aaee6']);
          });
        });
      })();
    </script>
  </body>
</html>
